name: Bug report
description: Something in the extension does not work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste cookies, session ids or other people's account names.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Search link
      description: The address of the trade search you were on. It holds only the filters.
      placeholder: https://www.pathofexile.com/trade2/search/poe2/…
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions or about:addons.
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other Chromium browser
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional. F12 → Console, errors mentioning poe2perfect or the trade API.
      render: text
